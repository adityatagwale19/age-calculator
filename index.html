<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <meta name="description" content="Find your exact age in years, months and days, how many days you have lived and how long until your next birthday.">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="card">
        <header class="card-header">
            <img src="images/birthday-cake.svg" alt="" class="illustration" width="160" height="140">
            <h1>Age Calculator</h1>
            <p class="subtitle">Pick your date of birth to see exactly how old you are.</p>
        </header>

        <form class="age-form" id="ageForm" novalidate>
            <label for="birthDate">Date of birth</label>
            <div class="form-row">
                <input type="date" id="birthDate" name="birthDate" required aria-describedby="formMessage">
                <button type="submit" class="btn">
                    <i class="fa-solid fa-calculator" aria-hidden="true"></i>
                    Calculate
                </button>
            </div>
            <p class="form-message" id="formMessage" role="alert"></p>
        </form>

        <section class="results" id="results" aria-live="polite">
            <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                <p>Your age will appear here.</p>
            </div>

            <div class="result-content" id="resultContent" hidden>
                <h2 class="visually-hidden">Your age</h2>
                <div class="age-grid">
                    <div class="age-tile">
                        <span class="age-number" id="years">0</span>
                        <span class="age-label" id="yearsLabel">years</span>
                    </div>
                    <div class="age-tile">
                        <span class="age-number" id="months">0</span>
                        <span class="age-label" id="monthsLabel">months</span>
                    </div>
                    <div class="age-tile">
                        <span class="age-number" id="days">0</span>
                        <span class="age-label" id="daysLabel">days</span>
                    </div>
                </div>

                <ul class="facts">
                    <li class="fact">
                        <span class="fact-icon" aria-hidden="true"><i class="fa-solid fa-sun"></i></span>
                        <span>
                            <span class="fact-title">Days lived</span>
                            <span class="fact-value" id="totalDays">0</span>
                        </span>
                    </li>
                    <li class="fact">
                        <span class="fact-icon" aria-hidden="true"><i class="fa-solid fa-gift"></i></span>
                        <span>
                            <span class="fact-title">Next birthday</span>
                            <span class="fact-value" id="nextBirthday">-</span>
                            <span class="fact-note" id="nextBirthdayNote"></span>
                        </span>
                    </li>
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
